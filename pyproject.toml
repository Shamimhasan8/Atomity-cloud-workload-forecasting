[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-workload-forecasting"
version = "1.0.0"
description = "Cloud workload forecasting challenge: analysis, baselines, leakage-safe validation and 2-hour holdout forecasting on the Azure Public Dataset V2 curated release"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
notebooks = [
    "jupyter>=1.0",
    "nbconvert>=7.0",
    "ipykernel>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "notebooks: end-to-end notebook execution tests (self-skip without dataset/Jupyter)",
]
